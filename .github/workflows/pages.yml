name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # If Settings → Pages → Source is still "Deploy from a branch", GitHub
      # also publishes the repo root (README) for this commit. Wait for that
      # build to finish so this deploy of site/ lands last and wins.
      - name: Wait for branch-based Pages build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          echo "Pages build_type: ${type:-unknown}"
          [ "$type" = "workflow" ] && exit 0
          for i in $(seq 1 36); do
            st=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '"\(.commit) \(.status)"' 2>/dev/null || true)
            echo "latest branch build: ${st:-none}"
            case "$st" in "${{ github.sha }} built"|"${{ github.sha }} errored") sleep 5; exit 0;; esac
            sleep 5
          done
          echo "Branch build not seen within 3 minutes; deploying anyway."
      - id: deployment
        uses: actions/deploy-pages@v4
