    <div style="max-width:1200px;margin:clamp(48px,6vw,100px) auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(16px,1.6vw,26px);">
      <img src="assets/img/tild6534-3064-4135-b631-306537353662__crown_white.svg" alt="" style="width:clamp(46px,4vw,72px);height:auto;">
      <h1 style="margin:0;font-family:'CaneNero',serif;font-weight:400;font-size:clamp(36px,4.4vw,84px);line-height:1;text-transform:uppercase;max-width:14ch;text-wrap:balance;">Discover the Vision Behind the Project</h1>
      <button onClick="{{ openPhotographers }}" style="margin-top:clamp(8px,1vw,16px);display:flex;align-items:baseline;gap:10px;font-family:'TNR','Tinos',serif;font-style:italic;font-size:clamp(18px,1.4vw,26px);color:#e6e6e6;background:transparent;border:1px solid #e6e6e6;border-radius:40px;padding:0 clamp(28px,2.4vw,44px);height:clamp(50px,3.4vw,62px);align-items:center;cursor:pointer;" style-hover="background:rgba(255,255,255,.1);"><span style="font-style:normal;font-family:'Poppins',sans-serif;font-size:.7em;">(40+)</span>All Photoshoots</button>
    </div>
    <div style="max-width:1400px;margin:clamp(48px,5vw,90px) auto 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1.4vw,24px);align-items:center;">
      <sc-for list="{{ strip }}" as="s" hint-placeholder-count="5">
        <button onClick="{{ s.open }}" aria-label="{{ s.title }}" style="{{ s.style }}">
          <img src="{{ s.src }}" alt="{{ s.title }}" style="width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);transition:filter .4s,transform .4s;" style-hover="filter:grayscale(0);transform:scale(1.04);">
        </button>
      </sc-for>
    </div>
  </section>

  <section data-screen-label="02 Albums" style="padding:clamp(56px,6vw,110px) clamp(16px,3vw,40px);">
    <div style="max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:clamp(40px,4vw,64px) clamp(20px,2.4vw,40px);">
      <sc-for list="{{ albums }}" as="a" hint-placeholder-count="6">
        <article style="display:flex;flex-direction:column;gap:14px;">
          <button onClick="{{ a.open }}" aria-label="{{ a.title }}" style="padding:0;border:0;background:#cfd3d8;cursor:pointer;aspect-ratio:4/5;overflow:hidden;display:block;">
            <img src="{{ a.cover }}" alt="{{ a.title }}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s;" style-hover="transform:scale(1.04);">
          </button>
          <h2 style="margin:6px 0 0;font-family:'TNR','Tinos',serif;font-style:italic;font-weight:400;font-size:clamp(24px,1.8vw,32px);line-height:1.15;color:#041e3a;">{{ a.title }}</h2>
          <p style="margin:0;font-size:clamp(14px,.9vw,16px);line-height:1.5;text-wrap:pretty;">{{ a.descr }}</p>
          <button onClick="{{ a.open }}" style="align-self:flex-start;margin-top:4px;font-family:'TNR','Tinos',serif;font-style:italic;font-size:16px;color:#041e3a;background:transparent;border:1px solid #041e3a;border-radius:40px;padding:0 30px;height:46px;cursor:pointer;transition:background .2s,color .2s;" style-hover="background:#041e3a;color:#fff;">See more</button>
        </article>
      </sc-for>
    </div>
  </section>

  <section id="contacts" data-screen-label="03 Contacts" style="padding:0 20px clamp(40px,4vw,50px);">

        <a href="tel:+37258788841" style="color:#041e3a;text-decoration:none;" style-hover="color:#3b5998;">+372 5878 8841</a>
        <a href="mailto:contest@qotb.eu" style="color:#041e3a;text-decoration:none;" style-hover="color:#3b5998;">contest@qotb.eu</a>
      </div>
    </div>
  </section>

      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:14px;">

            </button>
          </sc-for>
        </div>
      </div>
    </div>

      <button onClick="{{ prev }}" aria-label="Previous" style="position:absolute;left:clamp(4px,2vw,30px);top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(4,30,58,.5);color:#fff;font-size:22px;cursor:pointer;">←</button>
      <button onClick="{{ next }}" aria-label="Next" style="position:absolute;right:clamp(4px,2vw,30px);top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(4,30,58,.5);color:#fff;font-size:22px;cursor:pointer;">→</button>
      <button onClick="{{ closeViewer }}" aria-label="Close" style="position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:#fff;font-size:30px;cursor:pointer;">×</button>
      <div style="position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#e6e6e6;font-size:13px;letter-spacing:.06em;">{{ viewerCount }}</div>
    </div>
  </sc-if>

  <sc-if value="{{ photographersOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeAll }}" style="position:fixed;inset:0;z-index:60;background:rgba(4,30,58,.8);overflow-y:auto;padding:clamp(12px,4vw,60px) 12px;">

        <sc-for list="{{ shoots }}" as="g" hint-placeholder-count="4">
          <div style="display:flex;flex-direction:column;gap:10px;padding-top:20px;border-top:1px solid #041e3a;">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;">

              <a href="{{ g.igHref }}" target="_blank" rel="noopener" style="font-size:14px;color:#041e3a;">{{ g.ig }}</a>

            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              <sc-for list="{{ g.links }}" as="l" hint-placeholder-count="2">

            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>

  { title: 'September shooting, September 17–19', ig: '@sash2rush', igHref: 'https://www.instagram.com/sash2rush/', links: [{ label: 'Open gallery', href: 'https://sash2rush.gallery.photo/gallery/queen-of-the-baltic-17-19/' }] },
  { title: 'All shootings from September 17–20', ig: '@photos_golovan', igHref: 'https://www.instagram.com/photos_golovan/', links: [{ label: 'Medavita', href: 'https://633dc8977008d4-12447370.gallery.photo/gallery/medavita/' }, { label: 'Style lesson from Tania Momot', href: 'https://633dc8977008d4-12447370.gallery.photo/gallery/style-lesson-from-tania-momot/' }] },
  { title: 'Pre-party, rehearsal & OGO center', ig: '@by.pribytkova', igHref: 'https://www.instagram.com/by.pribytkova/', links: [{ label: 'Pre-party', href: 'https://nasstassya.gallery.photo/gallery/pre-party-queen-of-the-baltic/' }, { label: 'Rehearsal', href: 'https://nasstassya.gallery.photo/gallery/repeticia/' }, { label: 'OGO center', href: 'https://nasstassya.gallery.photo/gallery/pod-nabludeniem-enota/' }] },
  { title: 'Medavita & Children’s Foundation', ig: '@marina_danilove', igHref: 'https://www.instagram.com/marina_danilove/', links: [{ label: 'Medavita', href: 'https://marina-d.wfolio.pro/disk/18-09-2025-medavita-grhrtm' }, { label: 'Children’s Foundation', href: 'https://marina-d.wfolio.pro/disk/19-09-2025-detskiy-fond-xqkhzl' }] }
];

class Component extends DCLogic {
  state = { album: null, viewer: null, photographers: false };
  componentDidMount() {
    this.onKey = ev => {
      if (ev.key === 'Escape') this.state.viewer != null ? this.setState({ viewer: null }) : this.setState({ album: null, photographers: false });
      if (this.state.viewer != null && ev.key === 'ArrowRight') this.step(1);
      if (this.state.viewer != null && ev.key === 'ArrowLeft') this.step(-1);
    };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  componentDidUpdate(_, prev) {
    const lock = !!(this.state.album || this.state.photographers);
    if (lock !== !!(prev.album || prev.photographers)) document.body.style.overflow = lock ? 'hidden' : '';
  }
  step(d) {
    const a = ALBUMS.find(x => x.id === this.state.album); if (!a) return;
    this.setState(s => ({ viewer: (s.viewer + d + a.photos.length) % a.photos.length }));
  }
  renderVals() {
    const open = id => () => this.setState({ album: id, viewer: null });
    const a = ALBUMS.find(x => x.id === this.state.album);
    const v = this.state.viewer;
    const stripH = ['clamp(160px,22vw,420px)', 'clamp(130px,17vw,330px)', 'clamp(110px,13vw,260px)'];
    return {
      strip: STRIP.map(([id, src, h]) => ({ src: IMG + src, title: ALBUMS.find(x => x.id === id).title, open: open(id),
        style: { padding: 0, border: 0, background: 'transparent', cursor: 'pointer', overflow: 'hidden', display: 'block', width: '100%', height: stripH[h] } })),
      albums: ALBUMS.map(x => ({ ...x, cover: IMG + x.cover, open: open(x.id) })),
      shoots: SHOOTS,
      albumOpen: !!a,
      album: a || { title: '', long: '' },
      columnWidth: 'clamp(150px,22vw,300px)',
      albumPhotos: a ? a.photos.map((p, i) => ({ src: IMG + p, view: () => this.setState({ viewer: i }) })) : [],
      viewerOpen: !!a && v != null,
      viewerSrc: a && v != null ? IMG + a.photos[v] : '',
      viewerCount: a && v != null ? `${v + 1} / ${a.photos.length}` : '',
      prev: ev => { ev.stopPropagation(); this.step(-1); },
      next: ev => { ev.stopPropagation(); this.step(1); },
      closeViewer: () => this.setState({ viewer: null }),
      photographersOpen: this.state.photographers,
      openPhotographers: () => this.setState({ photographers: true }),
      closeAll: () => this.setState({ album: null, viewer: null, photographers: false }),
      stop: ev => ev.stopPropagation()
    };
  }
}
</script>
</body>
</html>
